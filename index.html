<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Oscilloscope – Dao động ký ảo, Vật lý 11</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="title-row"><h1>Virtual Oscilloscope</h1><span class="ver">v2.0.0</span></div>
        <p class="subtitle" data-i18n="subtitle"></p>
      </div>
      <div class="top-right">
        <div class="status-pill"><span class="dot" id="statusDot"></span><span id="statusText"></span></div>
        <button id="lang" class="lang-btn" type="button" data-lang="vi"><span class="lang-img" aria-hidden="true"></span></button>
        <label class="inline"><span data-i18n="lblTheme"></span>
          <select id="theme"><option value="light">Light</option><option value="dark">Dark</option><option value="fumo">FUMO</option></select></label>
      </div>
    </header>

    <div class="layout">
      <div class="main-col">
        <div class="scope-wrap">
          <canvas id="scope" width="1000" height="640"></canvas>
          <div class="hud-top-left" id="hudScale"></div>
          <div class="hud-top-right" id="hudTrig"></div>
        </div>
        <p id="msg" role="alert"></p>

        <div class="transport">
          <button id="btn" class="round rec"><span class="c"><img src="assets/record.png" alt=""></span><span id="btnLbl"></span></button>
          <button id="freeze" class="round pause" disabled><span class="c"><img src="assets/pause.png" alt=""></span><span id="freezeLbl"></span></button>
          <button id="egg" class="egg" type="button" aria-label="Fumo" title="?"><img src="assets/fumo-small.png" alt=""></button>
        </div>

        <section class="readout">
          <div class="card"><span class="k" data-i18n="kFreq"></span><span class="v"><b id="freq">—</b> <small>Hz</small></span><span class="sub" id="clarityInfo"></span></div>
          <div class="card"><span class="k" data-i18n="kPeriod"></span><span class="v"><b id="period">—</b> <small>ms</small></span><span class="sub" data-i18n="subPar"></span></div>
          <div class="card"><span class="k" data-i18n="kNote"></span><span class="v"><b id="noteName">—</b></span><span class="sub" id="noteSub">—</span></div>
          <div class="card"><span class="k" data-i18n="kCells"></span><span class="v"><b id="cells">—</b> <small data-i18n="uCells"></small></span><span class="sub" id="cellsFormula"></span></div>
          <div class="card"><span class="k" data-i18n="kTrig"></span><span class="v"><b id="trig">—</b></span><span class="sub" id="samplesPerDiv"></span></div>
          <div class="card" id="manCard"><span class="k" data-i18n="kMan"></span><span class="v"><b id="manF">—</b> <small>Hz</small></span><span class="sub" id="manSub"></span>
            <label class="nrow"><span data-i18n="lblN"></span><input id="nCyc" type="number" min="1" max="50" step="1" value="1"></label></div>
        </section>

        <details class="panel" id="logPanel">
          <summary data-i18n="pLog"></summary>
          <div class="fields">
            <label class="field"><span data-i18n="fRef"></span><input id="refHz" type="number" min="0" step="0.01" inputmode="decimal"></label>
            <div class="btnrow wide">
              <button id="logAdd" class="tbtn" type="button" data-i18n="bAdd"></button>
              <button id="logClear" class="tbtn" type="button" data-i18n="bClear"></button>
              <button id="logCsv" class="tbtn" type="button" data-i18n="bCsv"></button>
            </div>
          </div>
          <div class="tablewrap"><table class="logt"><thead><tr>
            <th data-i18n="thNo"></th><th data-i18n="thSrc"></th><th data-i18n="thRef"></th><th data-i18n="thSoft"></th><th data-i18n="thDS"></th><th data-i18n="thHand"></th><th data-i18n="thDH"></th>
          </tr></thead><tbody id="logBody"></tbody></table></div>
          <p id="logSummary" class="logsum"></p>
        </details>
      </div>

      <aside class="side-col">
        <section class="panel">
          <h2 data-i18n="pTest"></h2>
          <div class="fields">
            <label class="field wide"><span data-i18n="fSource"></span>
              <select id="source">
                <option value="mic" data-i18n="srcMic"></option>
                <option value="file" data-i18n="srcFile"></option>
                <optgroup data-i18n-label="gBasic"><option value="sine" data-i18n="sSine"></option><option value="square" data-i18n="sSquare"></option><option value="triangle" data-i18n="sTri"></option><option value="sawtooth" data-i18n="sSaw"></option></optgroup>
                <optgroup data-i18n-label="gInst"><option value="flute" data-i18n="iFlute"></option><option value="clarinet" data-i18n="iClar"></option><option value="trumpet" data-i18n="iTrump"></option><option value="guitar" data-i18n="iGuit"></option><option value="piano" data-i18n="iPiano"></option><option value="violin" data-i18n="iViolin"></option><option value="organ" data-i18n="iOrgan"></option></optgroup>
                <optgroup data-i18n-label="gVoice"><option value="voice" data-i18n="sVoice"></option></optgroup>
              </select></label>
            <label class="field wide" id="fileRow" hidden><span data-i18n="fFile"></span><input id="fileIn" type="file" accept=".wav,.mp3,audio/*"></label>
            <label class="field wide"><span data-i18n="fPitch"></span><select id="pitch"></select></label>
            <label class="check wide"><input id="speaker" type="checkbox"><span data-i18n="chkSpk"></span></label>
            <label class="field wide"><span><span data-i18n="fVol"></span>: <b id="volVal" class="mono">50%</b></span>
              <input id="volume" type="range" min="0" max="100" step="1" value="50"></label>
            <div class="player wide" id="player" hidden>
              <button id="playBtn" class="tbtn" type="button"></button>
              <span id="timeLbl" class="mono">0:00 / 0:00</span>
              <input id="seek" type="range" min="0" max="1000" step="1" value="0">
            </div>
          </div>
        </section>
        <section class="panel">
          <h2 data-i18n="pScale"></h2>
          <div class="fields">
            <label class="field wide"><span data-i18n="fView"></span>
              <select id="view"><option value="time" data-i18n="vTime"></option><option value="spec" data-i18n="vSpec"></option></select></label>
            <label class="field wide"><span data-i18n="fMeasure"></span>
              <select id="measure"><option value="auto" data-i18n="mAuto"></option><option value="manual" data-i18n="mManual"></option></select></label>
            <label class="field wide"><span data-i18n="fScale"></span>
              <select id="scale"><option value="1"></option><option value="2"></option><option value="5" selected></option><option value="10"></option><option value="20"></option></select></label>
            <label class="check wide"><input id="autoGain" type="checkbox" checked><span data-i18n="chkAuto"></span></label>
            <label class="field wide"><span><span data-i18n="fGain"></span>: <b id="gainVal" class="mono">4.0×</b></span>
              <input id="gain" type="range" min="0.5" max="10" step="0.5" value="4"></label>
          </div>
          <p class="hint" data-i18n="uHint"></p>
          <button id="snap" class="tbtn" type="button" data-i18n="bSnap"></button>
        </section>
        <p id="info" class="info-bar"></p>
      </aside>
    </div>

    <footer class="site-footer"><p data-i18n-html="ftLic"></p></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
